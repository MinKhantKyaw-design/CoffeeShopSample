# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

  schedule:
   - cron: '30 17 * * 0' # every monday 00:00 am with MM time (UTC time - 17:30 Sunday)

jobs:
  build:

    runs-on: windows-latest
    
    steps:

    - name: checkout CoffeeShopSample
      uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore backend\CoffeeShop.Api.csproj
    - name: Build
      run: dotnet build backend\CoffeeShop.Api.csproj --no-restore
    - name: Test
      run: dotnet test backend\CoffeeShop.Api.csproj --no-build --verbosity normal

  deploy:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Deploy
        run: echo "Deploy application"




