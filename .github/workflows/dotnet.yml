# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest
    
    steps:

    - name: checkout CoffeeShopSample
      uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore backend\CoffeeShop.Api.csproj
    - name: Build
      run: dotnet build CoffeeShop.Api.sln --no-restore
    - name: Test
      run: dotnet test CoffeeShop.Api.sln --no-build --verbosity normal
